name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PassKeeprCore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: PassKeeprCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('PassKeeprCore/Package.swift', 'PassKeeprCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run tests
        run: swift test
